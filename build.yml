name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Host-side engine tests (DSP smoke test + preset/fuzz checks)
      - name: Engine tests
        run: |
          python3 tools/gen_params.py
          g++ -O2 -std=c++17 -o host_render test/host_render.cpp app/src/main/cpp/engine.cpp app/src/main/cpp/wavetables.cpp
          python3 tools/test_presets.py ./host_render
          python3 tools/fuzz_engine.py ./host_render 30

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: WaveForge-apk
          path: app/build/outputs/apk/release/*.apk
